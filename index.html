<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Madhankumar Onteddubandi | Developer</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#050505;
color:white;
overflow-x:hidden;
}

/* Galaxy canvas */

#bg{
position:fixed;
top:0;
left:0;
z-index:-1;
}

/* Navbar */

nav{
position:fixed;
width:100%;
padding:18px 8%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
z-index:10;
}

nav a{
margin-left:20px;
color:white;
text-decoration:none;
}

/* Hero */

.hero{
height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;
}

.hero h1{
font-size:clamp(38px,8vw,70px);
font-weight:800;

background:linear-gradient(90deg,#00d4ff,#7c3aed);
-webkit-background-clip:text;
color:transparent;
}

.hero p{
margin-top:10px;
font-size:clamp(16px,3vw,22px);
opacity:0.8;
}

/* Sections */

section{
padding:120px 8%;
max-width:1100px;
margin:auto;
}

.title{
font-size:32px;
margin-bottom:30px;
}

/* Glass cards */

.card{
background:rgba(255,255,255,0.06);
backdrop-filter:blur(18px);
padding:30px;
border-radius:20px;
margin-top:20px;

opacity:0;
transform:translateY(80px);
transition:1s;
}

.card.show{
opacity:1;
transform:translateY(0);
}

/* Skills */

.skill{
margin-bottom:25px;
}

.bar{
height:10px;
background:#222;
border-radius:10px;
overflow:hidden;
}

.progress{
height:10px;
width:0;
background:linear-gradient(90deg,#00d4ff,#7c3aed);
transition:2s;
}

/* Footer */

footer{
text-align:center;
padding:40px;
opacity:0.6;
}

/* Mobile improvements */

@media(max-width:700px){

nav{
padding:15px 5%;
}

section{
padding:90px 6%;
}

}

</style>
</head>

<body>

<canvas id="bg"></canvas>

<nav>

<h3>NextGenLabs</h3>

<div>
<a href="#">Home</a>
<a href="#skills">Skills</a>
<a href="#contact">Contact</a>
</div>

</nav>

<section class="hero">

<h1>Madhankumar Onteddubandi</h1>
<p>Game Developer • App Developer</p>

</section>

<section id="skills">

<h2 class="title">Skills</h2>

<div class="card">

<div class="skill">
<p>Game Development</p>
<div class="bar"><div class="progress" data-width="90%"></div></div>
</div>

<div class="skill">
<p>App Development</p>
<div class="bar"><div class="progress" data-width="85%"></div></div>
</div>

<div class="skill">
<p>Software Engineering</p>
<div class="bar"><div class="progress" data-width="80%"></div></div>
</div>

<div class="skill">
<p>Debugging</p>
<div class="bar"><div class="progress" data-width="75%"></div></div>
</div>

</div>

</section>

<section id="contact">

<h2 class="title">Contact</h2>

<div class="card">

<p>Email:</p>
<br>

<a href="mailto:official.nextgenlabs@gmail.com">
official.nextgenlabs@gmail.com
</a>

</div>

</section>

<footer>

© 2026 Madhankumar Onteddubandi

</footer>

<script>

/* ===== GALAXY BACKGROUND ===== */

const canvas=document.getElementById("bg")

const scene=new THREE.Scene()

const camera=new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
)

const renderer=new THREE.WebGLRenderer({
canvas:canvas,
alpha:true
})

renderer.setPixelRatio(Math.min(window.devicePixelRatio,2))
renderer.setSize(window.innerWidth,window.innerHeight)

camera.position.z=5

/* Create stars */

const starGeometry=new THREE.BufferGeometry()

const starCount=3000
const positions=new Float32Array(starCount*3)

for(let i=0;i<starCount*3;i++){

positions[i]=(Math.random()-0.5)*100

}

starGeometry.setAttribute(
"position",
new THREE.BufferAttribute(positions,3)
)

const starMaterial=new THREE.PointsMaterial({
size:0.03,
color:0xffffff
})

const stars=new THREE.Points(starGeometry,starMaterial)

scene.add(stars)

/* Animate galaxy */

function animate(){

requestAnimationFrame(animate)

stars.rotation.y+=0.0005
stars.rotation.x+=0.0002

renderer.render(scene,camera)

}

animate()

/* Interaction */

let mouseX=0
let mouseY=0

document.addEventListener("mousemove",(event)=>{

mouseX=event.clientX/window.innerWidth-0.5
mouseY=event.clientY/window.innerHeight-0.5

})

document.addEventListener("touchmove",(event)=>{

mouseX=event.touches[0].clientX/window.innerWidth-0.5
mouseY=event.touches[0].clientY/window.innerHeight-0.5

})

function updateCamera(){

camera.position.x+=(mouseX*2-camera.position.x)*0.02
camera.position.y+=(-mouseY*2-camera.position.y)*0.02

requestAnimationFrame(updateCamera)

}

updateCamera()

/* Resize fix */

window.addEventListener("resize",()=>{

camera.aspect=window.innerWidth/window.innerHeight
camera.updateProjectionMatrix()

renderer.setSize(window.innerWidth,window.innerHeight)

})

/* Scroll animations */

const cards=document.querySelectorAll(".card")

const observer=new IntersectionObserver(entries=>{

entries.forEach(entry=>{

if(entry.isIntersecting){

entry.target.classList.add("show")

}

})

})

cards.forEach(card=>observer.observe(card))

/* Skills animation */

const skills=document.querySelectorAll(".progress")

const skillObserver=new IntersectionObserver(entries=>{

entries.forEach(entry=>{

if(entry.isIntersecting){

entry.target.style.width=entry.target.dataset.width

}

})

})

skills.forEach(skill=>skillObserver.observe(skill))

</script>

</body>
</html>
